<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>查核表 - 個人工作管理系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-mount"></div>
<main class="app-main">
  <div class="page-header">
    <div>
      <h1>🔍 查核表</h1>
      <div class="page-sub">商品／門市查核追蹤</div>
    </div>
    <button class="btn btn-primary" id="addBtn">＋ 新增查核項目</button>
  </div>

  <div id="statusTabs" class="tabs" style="margin-bottom:16px"></div>

  <div id="checklistList" class="card-grid"></div>
</main>

<div id="checklistModal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:640px">
    <h2 id="modalTitle">新增查核項目</h2>
    <form id="checklistForm">
      <div class="form-group">
        <label>商品</label>
        <input id="f_product" required placeholder="例如：即期品促銷組合">
      </div>
      <div class="form-group">
        <label>門市</label>
        <input id="f_store" placeholder="例如：台北忠孝店">
      </div>
      <div class="form-group">
        <label>狀態</label>
        <select id="f_status"></select>
      </div>
      <div class="form-group">
        <label>備註</label>
        <textarea id="f_note" rows="10" style="min-height:220px"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/reminder.js"></script>
<script src="js/checklist.js"></script>
</body>
</html>
