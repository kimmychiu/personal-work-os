<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每週回顧 - 個人工作管理系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-mount"></div>
<main class="app-main">
  <div class="page-header">
    <div>
      <h1>📊 每週回顧</h1>
      <div class="page-sub">自動整理本週完成/未完成事項</div>
    </div>
    <button class="btn btn-primary" id="saveReviewBtn">💾 儲存本週回顧</button>
  </div>

  <div class="filter-bar">
    <button class="btn btn-sm" id="prevWeekBtn">‹‹ 上週</button>
    <button class="btn btn-sm" id="thisWeekBtn">回到本週</button>
    <button class="btn btn-sm" id="nextWeekBtn">下週 ››</button>
    <span style="font-weight:bold" id="weekLabel"></span>
  </div>

  <div class="dash-grid">
    <div class="card">
      <div class="section-title">✅ 本週完成事項</div>
      <div id="completedSection"></div>
    </div>
    <div class="card">
      <div class="section-title">🚧 未完成事項（逾期）</div>
      <div id="incompleteSection"></div>
    </div>
    <div class="card dash-full">
      <div class="section-title">🔭 下週重點</div>
      <div id="suggestionList" style="font-size:12px;color:var(--text-dim);margin-bottom:8px"></div>
      <textarea id="nextFocusField" rows="4" placeholder="下週要優先處理的事項"></textarea>
      <div class="form-group" style="margin-top:12px">
        <label>反思備註</label>
        <textarea id="notesField" rows="3" placeholder="這週做得好的地方、可以改進的地方"></textarea>
      </div>
    </div>
    <div class="card dash-full">
      <div class="section-title">🗂️ 歷史回顧</div>
      <div id="historyList"></div>
    </div>
  </div>
</main>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/reminder.js"></script>
<script src="js/review.js"></script>
</body>
</html>
