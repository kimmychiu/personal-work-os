<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 - 個人工作管理系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-mount"></div>
<main class="app-main">
  <div class="page-header">
    <div>
      <h1>⚙️ 設定</h1>
      <div class="page-sub">連結你的 Google 試算表，讓手機與電腦看到同一份資料</div>
    </div>
  </div>

  <div id="statusBanner" class="notice-banner"></div>

  <div class="card" style="max-width:560px">
    <div class="section-title">雲端同步設定</div>
    <div class="form-group">
      <label>Apps Script Web 應用程式網址</label>
      <input id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="form-group">
      <label>密鑰（需與 Code.gs 內的 TOKEN 一致）</label>
      <input id="token" placeholder="你在 Code.gs 設定的密鑰">
    </div>
    <div class="form-group">
      <label>每日建議工時上限（小時，行事曆排程超過會提醒）</label>
      <input id="capacity" type="number" min="1" max="24" step="0.5">
    </div>
    <div class="item-actions">
      <button class="btn" id="testBtn">測試連線</button>
      <button class="btn btn-primary" id="saveBtn">儲存設定</button>
      <button class="btn btn-danger" id="clearBtn">清除設定</button>
    </div>
    <div id="testResult" style="margin-top:12px;font-size:13px;color:var(--text-dim)"></div>
  </div>

  <div class="card" style="max-width:560px;margin-top:16px">
    <div class="section-title">🏷️ 自訂待辦分類（主項目）</div>
    <div id="categoryManagerList" style="margin-bottom:12px"></div>
    <div class="item-actions">
      <input id="newCategoryInput" placeholder="輸入新分類名稱" style="width:auto;flex:1">
      <button class="btn btn-primary" id="addCategoryBtn">＋ 新增</button>
    </div>
    <p style="font-size:12px;color:var(--text-dim);margin:10px 0 0">
      刪除分類不會刪除已使用該分類的待辦事項，只是之後新增待辦時選單裡不會再預設出現。
    </p>
  </div>

  <div class="card" style="max-width:560px;margin-top:16px">
    <div class="section-title">還沒設定過？</div>
    <p style="font-size:13px;color:var(--text-dim);line-height:1.7;margin:0">
      請照著 <code>apps-script/SETUP_GUIDE.md</code> 的步驟，在你自己的 Google 帳號建立試算表並部署成 Web 應用程式，
      完成後把取得的網址與密鑰貼在上面即可。在完成設定之前，這個網頁仍可以正常使用，只是資料只會存在目前這台裝置的瀏覽器裡。
    </p>
  </div>
</main>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/reminder.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
