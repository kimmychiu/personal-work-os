<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作行事曆 - 個人工作管理系統</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav-mount"></div>
<main class="app-main">
  <div class="page-header">
    <div>
      <h1>📅 工作行事曆</h1>
      <div class="page-sub">依日期安排工作，超量排程會提醒你</div>
    </div>
    <button class="btn btn-primary" id="addEventBtn">＋ 新增事件</button>
  </div>

  <div class="filter-bar">
    <div class="tabs" id="calViewTabs">
      <div class="tab active" data-mode="week">週檢視</div>
      <div class="tab" data-mode="month">月檢視</div>
    </div>
    <button class="btn btn-sm" id="prevWeekBtn">‹‹ 上週</button>
    <button class="btn btn-sm hidden" id="prevMonthBtn">‹‹ 上月</button>
    <button class="btn btn-sm" id="todayBtn">回到今天</button>
    <button class="btn btn-sm" id="nextWeekBtn">下週 ››</button>
    <button class="btn btn-sm hidden" id="nextMonthBtn">下月 ››</button>
  </div>
  <div id="weekStrip" class="cal-week-strip"></div>
  <div id="monthGrid" class="cal-month-grid hidden"></div>

  <div class="card">
    <div class="page-header" style="margin-bottom:10px">
      <div class="section-title" style="margin:0">
        <button class="btn btn-sm" id="prevDayBtn">‹</button>
        <span id="selectedDateLabel"></span>
        <button class="btn btn-sm" id="nextDayBtn">›</button>
      </div>
      <div class="page-sub">今日已排 <b id="dayTotalHours"></b> / <span id="dayCapacityHours"></span> 小時</div>
    </div>
    <div id="capacityBanner" class="conflict-banner hidden"></div>
    <div id="eventList"></div>
  </div>
</main>

<div id="eventModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2 id="modalTitle">新增行事曆事件</h2>
    <div id="conflictWarn" class="conflict-banner hidden"></div>
    <form id="eventForm">
      <div class="form-group">
        <label>標題</label>
        <input id="f_title" required placeholder="例如：採購會議">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="f_date" required>
        </div>
        <div class="form-group">
          <label>類型</label>
          <select id="f_type"></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>開始時間</label>
          <input type="time" id="f_startTime">
        </div>
        <div class="form-group">
          <label>結束時間</label>
          <input type="time" id="f_endTime">
        </div>
      </div>
      <div class="form-group">
        <label>連結工作（選填）</label>
        <select id="f_taskId"></select>
      </div>
      <div class="form-group">
        <label class="checkbox-label"><input type="checkbox" id="f_reminder"> 到時間時提醒我</label>
      </div>
      <div class="form-group hidden" id="reminderMinutesGroup">
        <label>提醒時間</label>
        <select id="f_reminderMinutes"></select>
      </div>
      <div class="form-group">
        <label>備註</label>
        <textarea id="f_note"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('f_type').innerHTML = EVENT_TYPES.map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('f_reminderMinutes').innerHTML = REMINDER_OPTIONS.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    document.getElementById('f_reminder').addEventListener('change', (e) => {
      document.getElementById('reminderMinutesGroup').classList.toggle('hidden', !e.target.checked);
    });
  });
</script>
<script src="js/reminder.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
